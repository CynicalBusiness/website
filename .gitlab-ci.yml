stages:
    - test
    - build
    - deploy

.cache: &cache
    key: cache-$CI_COMMIT_REF_NAME
    fallback_keys:
        - cache-$CI_DEFAULT_BRANCH
    paths:
        - node_modules/

lint:
    stage: test
    image: node:22
    before_script:
        - corepack enable
        - yarn
    script:
        - yarn tsc --noEmit
        - yarn lint
    cache: *cache

build:
    stage: build
    image: node:22
    before_script:
        - corepack enable
        - yarn
    script:
        - yarn build
    artifacts:
        paths:
            - .output/
        expire_in: "1 day"
    cache: *cache

# TODO - May want to switch to docker so the modules can be built on the same platform as the runtime

deploy:
    stage: deploy
    image: alpine:3
    rules:
        - if: $CI_COMMIT_REF_PROTECTED && $CI_COMMIT_TAG
    before_script:
        - apk add --no-cache --update rsync openssh-client
        # Set up SSH access, per: https://docs.gitlab.com/ci/jobs/ssh_keys/#ssh-keys-when-using-the-docker-executor
        - eval $(ssh-agent -s)
        - chmod 400 "$DEPLOY_KEY"
        - ssh-add "$DEPLOY_KEY"
    script:
        - rsync -e "ssh -o StrictHostKeyChecking=no" -az --delete --include=".output/***" --include="package.json" --exclude="*" --chown $DEPLOY_USER:$DEPLOY_USER --chmod D775,F775 ./ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH
        - |
            ssh -o StrictHostKeyChecking=no $DEPLOY_USER@$DEPLOY_HOST "/bin/sh -s" << EOT
              set -x -e
              docker compose -f website.compose.yaml restart
            EOT
