build:
    stage: build
    image: node:22
    before_script:
        - corepack enable
        - yarn
    script:
        - yarn build
    artifacts:
        paths:
            - .output/
        expire_in: "1 day"
    cache:
        key: cache-$CI_COMMIT_BRANCH
        fallback_keys:
            - cache-$CI_DEFAULT_BRANCH
        paths:
            - node_modules/

deploy:
    stage: deploy
    image: alpine:3
    rules:
        - if: $CI_COMMIT_TAG
        - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
        - when: manual
    before_script:
        - apk add --no-cache --update rsync openssh-client
        # Set up SSH access, per: https://docs.gitlab.com/ci/jobs/ssh_keys/#ssh-keys-when-using-the-docker-executor
        - eval $(ssh-agent -s)
        - chmod 400 "$DEPLOY_KEY"
        - ssh-add "$DEPLOY_KEY"
    script:
        - rsync -e "ssh -o StrictHostKeyChecking=no" -vaz --delete --include=".output/***" --exclude="*" --chown $DEPLOY_USER:$DEPLOY_USER --chmod D775,F775 ./ $DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH
