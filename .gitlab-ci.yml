build:
    stage: build
    image: node:22
    before_script:
        - corepack enable
        - yarn
    script:
        - yarn build
    artifacts:
        paths:
            - .output/
        expire_in: "1 day"
        exclude:
            - .output/server/node_modules/**/*
    cache:
        key: cache-$CI_COMMIT_BRANCH
        fallback_keys:
            - cache-$CI_DEFAULT_BRANCH
        paths:
            - node_modules/

deploy:
    stage: deploy
    image: alpine:3
    rules:
        - if: $CI_COMMIT_TAG
        - when: manual
    before_script:
        - apk add --no-cache --update openssh-client curl unzip
        # Set up SSH access, per: https://docs.gitlab.com/ci/jobs/ssh_keys/#ssh-keys-when-using-the-docker-executor
        - eval $(ssh-agent -s)
        - chmod 400 "$DEPLOY_KEY"
        - ssh-add "$DEPLOY_KEY"
    script:
        - ssh $DEPLOY_USER@$DEPLOY_HOST << EOF
          curl --location --output "/tmp/website-$CI_JOB_ID.zip" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/artifacts/$CI_COMMIT_REF_NAME/download?job=build&job_token=$CI_JOB_TOKEN"
          rm -rf ~/$DEPLOY_PATH
          mkdir -p ~/$DEPLOY_PATH
          unzip "/tmp/website-$CI_JOB_ID.zip" -d ~/$DEPLOY_PATH
          EOF
